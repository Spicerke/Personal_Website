name: Deploy

# The site is a Worker serving ./public as static assets (see wrangler.jsonc).
# Workers static assets have no built-in git integration the way Pages did, so
# nothing reaches kai-spicer.com until `wrangler deploy` runs. This workflow is
# what runs it — a push to main is once again all it takes.
on:
  push:
    branches: [main]
    paths:
      # Only what actually changes the deployed output. A README-only commit
      # doesn't need a deploy; if you add a new top-level published directory,
      # add it here or its changes will never ship.
      - 'public/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:            # and on demand, from the Actions tab

# A deploy is a whole-site replace, so only the newest one matters. Cancel an
# in-flight run when another push lands rather than racing to publish.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned so a wrangler release can't change deploy behaviour behind
          # your back. Bump it deliberately, and keep it matched to whatever
          # `npx wrangler --version` prints locally.
          wranglerVersion: '4.131.1'

      - name: Purge Cloudflare edge cache
        # A zone Cache Rule caches HTML at the edge regardless of _headers, and
        # it ignores query strings, so without this a successful deploy keeps
        # serving the old pages. The site is small; purging everything is
        # simpler than tracking which URLs changed.
        # Needs CLOUDFLARE_ZONE_ID, and Zone > Cache Purge on the API token.
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | tee /tmp/purge.json
          grep -q '"success":true' /tmp/purge.json

      - name: Verify the change is actually being served
        # Compare every published page byte-for-byte with what's in the repo.
        # The edge serves the files unmodified, so any difference means a
        # stale page. Retries give the purge a moment to propagate.
        run: |
          stale=""
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            stale=""
            for f in public/*.html; do
              page=$(basename "$f" .html)
              [ "$page" = index ] && page=""
              curl -fsSL "https://kai-spicer.com/${page}" -o /tmp/live.html
              cmp -s /tmp/live.html "$f" || stale="$stale /${page}"
            done
            [ -z "$stale" ] && { echo "All pages are live and match the repo."; exit 0; }
            echo "Attempt $attempt: still stale:$stale"
          done
          echo "::error::Live pages don't match the deployed files:$stale"
          exit 1
